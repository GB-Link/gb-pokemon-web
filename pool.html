<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Content - PokemonGB Online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <div class="header-row">
            <h1>Pool Content</h1>
            <a href="index.html" class="settings-btn header-link">&larr; Back</a>
        </div>

        <div class="card">
            <div class="form-group">
                <label>Generation:</label>
                <div class="btn-group" id="pool-gen-select">
                    <button type="button" class="btn-option" data-value="1">Gen 1</button>
                    <button type="button" class="btn-option selected" data-value="2">Gen 2</button>
                    <button type="button" class="btn-option" data-value="3">Gen 3</button>
                </div>
            </div>
            <div class="form-group pool-controls">
                <input type="text" id="pool-search" placeholder="Search species, nickname or OT">
                <select id="pool-sort" class="setting-input-url">
                    <option value="dex">Dex number</option>
                    <option value="name">Name</option>
                    <option value="level">Level (high to low)</option>
                </select>
                <button id="btn-pool-refresh" type="button">Refresh</button>
            </div>
            <p id="pool-status" class="pool-status">Loading pool...</p>
            <p class="pool-source-line">Sprites from PokeAPI</p>
        </div>

        <div id="pool-summary" class="pool-summary"></div>

        <div id="pool-grid" class="pool-grid"></div>

        <footer class="app-footer">
            <p>
                Original <a href="https://github.com/Lorenzooone/PokemonGB_Online_Trades_and_Battles"
                    target="_blank">CLI</a> by
                <a href="https://github.com/Lorenzooone" target="_blank">Lorenzooone</a>.
                Ported to web by <a href="https://github.com/starlarkus" target="_blank">Starlark</a>
            </p>
            <p>Sprites &copy; Nintendo/Creatures/GAME FREAK, served by
                <a href="https://github.com/PokeAPI/sprites" target="_blank">PokeAPI</a></p>
        </footer>
    </div>

    <div id="pool-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Pokemon Details</h2>
                <button id="pool-modal-close" class="modal-close">&times;</button>
            </div>
            <div id="pool-modal-body"></div>
        </div>
    </div>

    <script type="module">
        import { PoolUI } from './src/pool/PoolUI.js?v=91';
        window.addEventListener('DOMContentLoaded', () => { window.poolUI = new PoolUI(); });
    </script>
</body>

</html>
